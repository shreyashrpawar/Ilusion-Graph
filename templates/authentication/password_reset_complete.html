{% extends 'base.html' %}

{% block title %}Password Reset Complete | Ilusion Graph{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto space-y-6 my-auto py-12">
    <!-- Success Icon Header -->
    <div class="text-center space-y-2">
        <div class="mx-auto h-14 w-14 rounded-2xl bg-brand-50 border border-brand-200 text-brand-600 flex items-center justify-center shadow-sm">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="text-3xl font-serif font-bold text-slate-900 tracking-tight">Password Reset Complete</h2>
        <p class="text-xs text-slate-500">Your password has been successfully updated</p>
    </div>

    <!-- White Card -->
    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm text-center space-y-6">
        <p class="text-sm text-slate-600 leading-relaxed">
            You can now log in with your new credentials.
        </p>

        <div class="pt-2">
            <a href="{% url 'login' %}" class="inline-flex items-center justify-center w-full py-3 px-4 bg-brand-accent hover:bg-brand-600 text-white font-semibold text-sm rounded-xl shadow-sm transition-all">
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
