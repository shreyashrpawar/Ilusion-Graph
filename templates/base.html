<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ilusion Graph{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                            accent: '#00c885'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Lora', 'Georgia', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-serif {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .form-control,
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            color: #0f172a;
            font-size: 0.875rem;
            line-height: 1.25rem;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        .form-control:focus,
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .form-control::placeholder,
        input::placeholder {
            color: #94a3b8;
        }

        .helptext {
            display: block;
            margin-top: 0.25rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body class="h-full bg-slate-50 text-slate-900 flex flex-col min-h-screen antialiased">

    {% include 'components/navbar.html' %}

    <main class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6 flex flex-col">
        {% block content %}
        {% endblock %}
    </main>

    {% include 'components/footer.html' %}

</body>

</html>
