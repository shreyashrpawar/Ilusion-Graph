<header class="border-b border-slate-200 bg-white sticky top-0 z-50">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Logo & Branding -->
        <a href="{% url 'vault:vault_home' %}" class="flex items-center space-x-3 group">
            <div class="h-9 w-9 rounded-xl bg-brand-600 flex items-center justify-center font-bold text-white shadow-sm group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <span class="text-xl font-serif font-bold text-slate-900 tracking-tight">Ilusion Graph</span>
        </a>

        <!-- Center Link -->
        <nav class="flex items-center space-x-8 text-sm font-medium">
            <a href="{% url 'vault:vault_home' %}" class="text-brand-700 font-semibold border-b-2 border-brand-600 pb-0.5 transition-colors">
                Files Dashboard
            </a>
        </nav>

        <!-- Right User Actions -->
        <div class="flex items-center space-x-4">
            {% if request.user.is_authenticated %}
            <!-- User Avatar Pill -->
            <div class="flex items-center space-x-2 bg-slate-100 border border-slate-200 rounded-full px-3 py-1 text-xs font-semibold text-slate-700">
                <span class="h-6 w-6 rounded-full bg-slate-600 text-white flex items-center justify-center text-xs uppercase font-bold">
                    {{ request.user.username|slice:":1" }}
                </span>
                <span class="truncate max-w-[120px]">{{ request.user.username }}</span>
            </div>

            <!-- Logout Link -->
            <a href="{% url 'logout' %}" class="text-xs font-semibold text-rose-600 hover:text-rose-700 transition-colors">
                Logout
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="text-sm font-medium text-slate-700 hover:text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100 transition-colors">
                Sign In
            </a>
            <a href="{% url 'register' %}" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl transition-all shadow-sm">
                Register
            </a>
            {% endif %}
        </div>
    </div>
</header>
