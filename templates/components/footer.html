<footer class="border-t border-slate-200 bg-white mt-auto py-8 text-slate-500">
    <div class="w-full px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
        <div class="flex items-center space-x-2">
            <div class="h-6 w-6 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-white text-xs">
                IV
            </div>
            <span class="font-semibold text-slate-700">Ilusion Graph</span>
            <span class="text-slate-400">&copy; {% now "Y" %} All rights reserved.</span>
        </div>
        <div class="flex items-center space-x-6">
            <a href="{% url 'vault:vault_home' %}" class="hover:text-brand-600 transition-colors">Files</a>
            {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}" class="hover:text-rose-600 transition-colors">Logout</a>
            {% else %}
            <a href="{% url 'login' %}" class="hover:text-brand-600 transition-colors">Login</a>
            <a href="{% url 'register' %}" class="hover:text-brand-600 transition-colors">Register</a>
            {% endif %}
        </div>
    </div>
</footer>
